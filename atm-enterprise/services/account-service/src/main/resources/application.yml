server:
  port: 8082

spring:
  application:
    name: account-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/atmdb}
    username: ${DB_USERNAME:atmuser}
    password: ${DB_PASSWORD:atmsecret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET:Y2hhbmdlLW1lLXN1cGVyLXNlY3JldC1rZXktZm9yLWF0bS1lbnRlcnByaXNlLWp3dC1zaWduaW5nLWtleS0yNTZiaXRz}
    issuer: atm-enterprise

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.atm.account: INFO
    org.hibernate.SQL: DEBUG
