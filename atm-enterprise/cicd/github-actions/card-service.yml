name: card-service CI

on:
  push:
    branches: [main]
    paths:
      - 'services/card-service/**'
      - '.github/workflows/card-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/card-service/**'
  workflow_dispatch:

jobs:
  build:
    name: Build (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build (skip tests)
        working-directory: services/card-service
        run: mvn -B clean package -DskipTests
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: card-service-jar
          path: services/card-service/target/*.jar
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        working-directory: services/card-service
        run: mvn -B test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-service-test-report
          path: services/card-service/target/surefire-reports/

  docker-build:
    name: Docker build (PR / branch)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: services/card-service
          file: services/card-service/Dockerfile
          push: false
          tags: atm/card-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-push:
    name: Docker push (on main)
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: services/card-service
          file: services/card-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/card-service:latest
            ${{ secrets.DOCKER_USERNAME }}/card-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
