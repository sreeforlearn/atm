---
# ============================================================
# Kafka (single-node, KRaft mode) for dev/atm-enterprise
# + Zookeeper for compatibility with bitnami/kafka:3.7 defaults.
# Splitting into one file keeps `kubectl apply -f k8s/kafka.yaml`
# self-contained. Production should use Strimzi / MSK / Confluent
# Operator instead.
# ============================================================

---
# ---- Kafka headless + ClusterIP service ----
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: atm-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: atm-enterprise
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
      protocol: TCP
---
# ---- Zookeeper Service ----
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: atm-dev
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: atm-enterprise
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
      protocol: TCP
---
# ---- Zookeeper Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: atm-dev
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/part-of: atm-enterprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/part-of: atm-enterprise
    spec:
      containers:
        - name: zookeeper
          image: bitnami/zookeeper:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 2181
              protocol: TCP
          env:
            - name: ALLOW_ANONYMOUS_LOGIN
              value: "yes"
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: "srvr,ruok,mntr"
          readinessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 2181
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# ---- Kafka Deployment ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: atm-dev
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: atm-enterprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: atm-enterprise
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 9092
              protocol: TCP
            - name: controller
              containerPort: 9093
              protocol: TCP
          env:
            # KRaft mode: single node acts as broker + controller
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka:9093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            # Single-broker dev defaults
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            # Auto-create topics for dev convenience
            - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
