apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: atm-dev
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: atm-enterprise
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: atm-enterprise
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: atm/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: API_GATEWAY_URL
              value: http://apigateway.atm-dev.svc.cluster.local:8080
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
