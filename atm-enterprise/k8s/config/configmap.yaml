apiVersion: v1
kind: ConfigMap
metadata:
  name: atm-config
  namespace: atm-dev
  labels:
    app.kubernetes.io/part-of: atm-enterprise
data:
  # ---- Database (logical) ----
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: atmdb

  # ---- Service discovery (in-cluster DNS) ----
  AUTH_SERVICE: auth-service
  ACCOUNT_SERVICE: account-service
  TRANSACTION_SERVICE: transaction-service
  CARD_SERVICE: card-service
  API_GATEWAY: apigateway

  # ---- Messaging ----
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC_TRANSACTIONS: atm.transactions
  KAFKA_TOPIC_AUDIT: atm.audit
  KAFKA_CONSUMER_GROUP: atm-consumer

  # ---- Security ----
  JWT_EXPIRATION_MS: "3600000"
  JWT_ISSUER: atm-enterprise
  PIN_MAX_ATTEMPTS: "3"

  # ---- Observability ----
  LOG_LEVEL: INFO
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
