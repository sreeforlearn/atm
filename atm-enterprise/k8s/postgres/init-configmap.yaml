apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: atm-dev
  labels:
    app.kubernetes.io/part-of: atm-enterprise
    app.kubernetes.io/component: postgres
data:
  # The Postgres official image runs every *.sql / *.sh file under
  # /docker-entrypoint-initdb.d on first boot (when the data dir
  # is empty). We mount this ConfigMap there so the schema, tables
  # and seed data are applied automatically.
  01_create_schema.sql: |
    -- Create the atmdb database + atm schema (identical to
    -- database/init/01_create_schema.sql in the repo).
    -- Run via the official Postgres image only (uses \c meta-command).
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'atmdb') THEN
            PERFORM dblink_exec(
                'dbname=' || current_database(),
                'CREATE DATABASE atmdb'
            );
        END IF;
    END$$;
    \c atmdb
    CREATE SCHEMA IF NOT EXISTS atm;
    SET search_path TO atm, public;
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
  02_create_tables.sql: |
    SET search_path TO atm, public;
    CREATE TABLE IF NOT EXISTS cards (
        id                BIGSERIAL PRIMARY KEY,
        card_number       VARCHAR(16)  UNIQUE NOT NULL,
        pin_hash          VARCHAR       NOT NULL,
        holder_name       VARCHAR(100),
        status            VARCHAR(20)  DEFAULT 'ACTIVE',
        card_type         VARCHAR(20)  DEFAULT 'DEBIT',
        failed_attempts   INT           DEFAULT 0,
        expiry_date       DATE,
        daily_limit       DECIMAL(12,2) DEFAULT 50000,
        monthly_limit     DECIMAL(12,2) DEFAULT 200000,
        created_at        TIMESTAMP     DEFAULT NOW(),
        updated_at        TIMESTAMP,
        blocked_at        TIMESTAMP,
        blocked_reason    VARCHAR(255)
    );
    CREATE TABLE IF NOT EXISTS accounts (
        id              BIGSERIAL PRIMARY KEY,
        account_number  VARCHAR(14)  UNIQUE NOT NULL,
        card_number     VARCHAR(16)  REFERENCES cards(card_number),
        holder_name     VARCHAR(100),
        balance         DECIMAL(12,2) DEFAULT 0,
        account_type    VARCHAR(20)  DEFAULT 'SAVINGS',
        status          VARCHAR(20)  DEFAULT 'ACTIVE',
        currency        VARCHAR(3)   DEFAULT 'INR',
        created_at      TIMESTAMP    DEFAULT NOW(),
        updated_at      TIMESTAMP
    );
    CREATE TABLE IF NOT EXISTS transactions (
        id              BIGSERIAL PRIMARY KEY,
        reference_number UUID DEFAULT gen_random_uuid() UNIQUE,
        from_account    VARCHAR(14),
        to_account      VARCHAR(14),
        amount          DECIMAL(12,2),
        type            VARCHAR(20),
        status          VARCHAR(20),
        balance_before  DECIMAL(12,2),
        balance_after   DECIMAL(12,2),
        remark          VARCHAR(255),
        channel         VARCHAR(20)  DEFAULT 'ATM',
        timestamp       TIMESTAMP    DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS audit_logs (
        id              BIGSERIAL PRIMARY KEY,
        card_number     VARCHAR(16),
        action          VARCHAR(50),
        ip_address      VARCHAR(45),
        status          VARCHAR(20),
        timestamp       TIMESTAMP DEFAULT NOW(),
        details         TEXT
    );
    CREATE TABLE IF NOT EXISTS account_audit (
        id                BIGSERIAL PRIMARY KEY,
        account_number    VARCHAR(14),
        action            VARCHAR(20),
        amount            DECIMAL(12,2),
        balance_after     DECIMAL(12,2),
        reference_number  UUID,
        performed_by      VARCHAR(100),
        timestamp         TIMESTAMP DEFAULT NOW()
    );
    CREATE TABLE IF NOT EXISTS card_limits (
        id               BIGSERIAL PRIMARY KEY,
        card_number      VARCHAR(16) UNIQUE,
        daily_spent      DECIMAL(12,2) DEFAULT 0,
        monthly_spent    DECIMAL(12,2) DEFAULT 0,
        last_reset_date  DATE DEFAULT CURRENT_DATE
    );
    CREATE INDEX IF NOT EXISTS idx_transactions_from_account_ts
        ON transactions (from_account, timestamp);
    CREATE INDEX IF NOT EXISTS idx_audit_logs_card_ts
        ON audit_logs (card_number, timestamp);
    CREATE INDEX IF NOT EXISTS idx_accounts_card_number
        ON accounts (card_number);
    CREATE INDEX IF NOT EXISTS idx_transactions_to_account_ts
        ON transactions (to_account, timestamp);
    CREATE INDEX IF NOT EXISTS idx_account_audit_ref
        ON account_audit (reference_number);
  03_seed_data.sql: |
    SET search_path TO atm, public;
    INSERT INTO cards (card_number, pin_hash, holder_name, status, card_type, failed_attempts, expiry_date, daily_limit, monthly_limit)
    VALUES
      ('4111111111111111','$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAg8B6CXuRjEaQKqHkXRjQ8lJjvqm','Alice Sharma','ACTIVE','DEBIT',0,DATE '2027-12-31',50000,200000),
      ('4222222222222222','$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAg8B6CXuRjEaQKqHkXRjQ8lJjvqm','Bob Verma','ACTIVE','DEBIT',0,DATE '2027-06-30',50000,200000),
      ('4333333333333333','$2a$10$N9qo8uLOickgx2ZMRZoMyeIjZAg8B6CXuRjEaQKqHkXRjQ8lJjvqm','Carol Iyer','ACTIVE','CREDIT',0,DATE '2028-03-31',100000,500000)
    ON CONFLICT (card_number) DO NOTHING;
    INSERT INTO accounts (account_number, card_number, holder_name, balance, account_type, status, currency)
    VALUES
      ('ACCT1000000001','4111111111111111','Alice Sharma',50000.00,'SAVINGS','ACTIVE','INR'),
      ('ACCT2000000002','4222222222222222','Bob Verma',25000.00,'CURRENT','ACTIVE','INR'),
      ('ACCT3000000003','4333333333333333','Carol Iyer',100000.00,'SAVINGS','ACTIVE','INR')
