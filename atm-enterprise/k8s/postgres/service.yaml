apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: atm-dev
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: atm-enterprise
spec:
  # Headless service so the StatefulSet pods are addressable as
  # postgres-0.postgres.atm-dev.svc.cluster.local (used by clients
  # that need stable DNS, e.g. for streaming/replication demos).
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: pgsql
      port: 5432
      targetPort: 5432
      protocol: TCP
